name: refresh profile

on:
  schedule:
    # Every six hours. GitHub's commit-activity statistics are cached on their
    # side anyway, so a tighter cadence would mostly re-commit identical bytes.
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/profile.toml"
      - "generator/**"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install font tooling
        run: pip install --quiet fonttools brotli

      - name: Render panels and README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generator/build.py

      - name: Commit if anything actually changed
        run: |
          git config user.name  "Mohil-Ahuja"
          git config user.email "mohilahuja@gmail.com"
          # version.json records when the rendered output last actually
          # changed. Leaving it uncommitted meant every run compared against a
          # stale digest, re-stamped the README with today's date, and pushed a
          # commit that changed nothing but that line.
          git add -A assets README.md data/cache.json data/version.json
          if git diff --cached --quiet; then
            echo "No change in the rendered profile; nothing to commit."
            exit 0
          fi
          git commit -m "Refresh profile telemetry"
          # A scheduled run and a hand push can land in the same minute, and
          # the loser is rejected as stale. Rebasing and retrying keeps the
          # refresh from being skipped for six hours over a race.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected; rebasing on origin/main (attempt $attempt)."
            git pull --rebase --autostash origin main
          done
          echo "Could not push after three attempts." >&2
          exit 1
